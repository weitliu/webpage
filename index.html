<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f7f7f7;
      color: #222;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .card {
      width: min(90%, 640px);
      background: white;
      padding: 48px 36px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }

    h1 {
      margin-top: 0;
      font-size: 40px;
    }

    p {
      font-size: 18px;
      line-height: 1.6;
      color: #555;
    }

    button {
      margin-top: 20px;
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #222;
      color: white;
    }

    button:hover {
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <main class="card">
    <h1>Hello 👋</h1>
    <p>我的第一个 GitHub Pages 网站已经跑起来了。</p>
    <p>之后我会把这里换成真正的网站。</p>
    <button onclick="sayHello()">点我测试</button>
  </main>

  <script>
    function sayHello() {
      alert("网站运行正常！");
    }
  </script>
</body>
</html>
